<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Cảnh Báo TBA/19</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #e74c3c;
            --bg-color: #f4f7f6;
            --text-color: #333;
            --border-color: #ddd;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            line-height: 1.6;
        }

        h2 {
            text-align: center;
            color: var(--primary-color);
            text-transform: uppercase;
            margin-bottom: 20px;
            border-bottom: 3px solid var(--primary-color);
            padding-bottom: 10px;
        }

        /* --- SEARCH BOX --- */
        /* Style cho nút bấm cạnh thanh tìm kiếm */
.search-container {
            max-width: 600px;
            margin: 0 auto 25px auto;
            position: relative;
        }

        .search-box {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid var(--primary-color);
            border-radius: 25px;
            font-size: 16px;
            outline: none;
            box-sizing: border-box;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* --- TABLE STYLES --- */
        .table-container {
            overflow-x: auto;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            border-radius: 8px;
            background: white;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background-color: var(--primary-color);
            color: white;
        }

        th, td {
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            text-align: left;
        }

        th {
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            white-space: nowrap;
        }

        tbody tr:nth-child(even) { background-color: #f8f9fa; }
        tbody tr:hover { background-color: #f1f1f1; transition: 0.2s; }

        .no-column { width: 50px; text-align: center; font-weight: bold; }
        .alarm-column { width: 200px; color: #2980b9; font-weight: 600; }
        
        /* Màu sắc trạng thái */
        .effect-critical { color: #e74c3c; font-weight: bold; }
        .effect-warning { color: #d35400; font-weight: bold; }

        /* --- RESPONSIVE MOBILE --- */
        @media (max-width: 768px) {
            table, thead, tbody, th, td, tr { 
                display: block; 
            }
            
            thead tr { 
                position: absolute;
                top: -9999px;
                left: -9999px;
            }

            tr { 
                margin-bottom: 15px; 
                border: 2px solid var(--primary-color);
                border-radius: 8px;
                overflow: hidden;
            }

            td { 
                border: none;
                border-bottom: 1px solid #eee; 
                position: relative;
                padding-left: 45% !important; 
                text-align: left !important;
                white-space: normal;
            }

            td:before { 
                position: absolute;
                top: 12px;
                left: 15px;
                width: 40%; 
                padding-right: 10px; 
                white-space: nowrap;
                font-weight: bold;
                color: var(--primary-color);
                content: attr(data-label);
                text-transform: uppercase;
                font-size: 0.75rem;
            }
            
            .no-column { background: #eee; width: auto; }
        }

        /* --- PRINT STYLES --- */
        @media print {
        @page {
            size: A4 landscape; /* Ép in ngang để bảng không bị hẹp */
            margin: 1cm;
        }

        /* 1. Reset toàn bộ về mặc định để tránh chồng chéo */
        html, body {
            background: white !important;
            padding: 0 !important;
            margin: 0 !important;
            font-family: Arial, sans-serif !important;
            font-size: 10pt;
        }

        .search-container, .search-box { display: none !important; } /* Ẩn tìm kiếm */

        /* 2. Ép bảng hiển thị đúng dạng table (không bị block như mobile) */
        .table-container { box-shadow: none !important; border-radius: 0 !important; width: 100% !important; }
        table { 
            display: table !important; 
            width: 100% !important; 
            border-collapse: collapse !important;
            border: 0.5pt solid black !important;
        }

        thead { display: table-header-group !important; } /* Hiện tiêu đề ở mỗi trang */
        tr { display: table-row !important; page-break-inside: avoid !important; }
        
        th, td { 
            display: table-cell !important; /* Ép về ô bảng */
            border: 0.5pt solid black !important; /* Nét in mảnh sắc sảo */
            padding: 6pt !important;
            color: black !important;
            background: transparent !important;
        }

        th { background-color: #eeeeee !important; -webkit-print-color-adjust: exact; }
        
        /* 3. Tắt nội dung phụ của mobile */
        td:before { display: none !important; }
        td { padding-left: 8px !important; }

        /* 4. Định dạng cột */
        .no-column { width: 30pt !important; text-align: center; }
        .alarm-column { font-weight: bold; width: 120pt !important; }
    }
    </style>
</head>

        const tableBody = document.getElementById('alarm-body');
        const searchInput = document.getElementById('searchInput');

        function renderTable(data) {
            tableBody.innerHTML = '';
            data.forEach(item => {
                // Xác định class màu sắc cho Effect
                let effectClass = '';
                if (item.effect.includes('Zero') || item.effect.includes('Venting')) effectClass = 'effect-critical';
                else if (item.effect.includes('Short stop') || item.effect.includes('Dừng ngắn')) effectClass = 'effect-warning';

                const row = `
                    <tr>
                        <td class="no-column" data-label="NO.">${item.no}</td>
                        <td class="alarm-column" data-label="Alarm">${item.alarm}</td>
                        <td data-label="Cause">${item.cause}</td>
                        <td class="${effectClass}" data-label="Effect">${item.effect}</td>
                        <td class="instruction-column" data-label="Instruction">${item.instruction}</td>
                    </tr>
                `;
                tableBody.innerHTML += row;
            });
        }

        // Xử lý tìm kiếm
        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = alarmData.filter(item => 
                item.no.toLowerCase().includes(term) ||
                item.alarm.toLowerCase().includes(term) ||
                item.cause.toLowerCase().includes(term)
            );
            renderTable(filtered);
        });

        // Khởi tạo bảng
        renderTable(alarmData);
    </script>
