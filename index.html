<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Cảnh Báo TBA/19</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #e74c3c;
            --bg-color: #f4f7f6;
            --text-color: #333;
            --border-color: #ddd;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            line-height: 1.6;
        }

        h2 {
            text-align: center;
            color: var(--primary-color);
            text-transform: uppercase;
            margin-bottom: 20px;
            border-bottom: 3px solid var(--primary-color);
            padding-bottom: 10px;
        }

        /* --- BUTTON XEM ẢNH SƠ ĐỒ --- */
        .header-actions {
            text-align: center;
            margin-bottom: 20px;
        }

        .btn-view-map {
            background-color: #2980b9;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }

        .btn-view-map:hover {
            background-color: #3498db;
            transform: translateY(-2px);
            box-shadow: 0 6px 8px rgba(0,0,0,0.15);
        }

        /* --- MODAL POPUP XEM ẢNH --- */
        .modal {
            display: none; /* Ẩn mặc định */
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.7); /* Nền mờ phía sau */
            backdrop-filter: blur(4px);
        }

        .modal-content {
            background-color: #fefefe;
            margin: 5% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 85%;
            max-width: 900px;
            border-radius: 8px;
            position: relative;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            animation: zoomIn 0.3s ease;
        }

        @keyframes zoomIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .close-btn {
            color: #aaa;
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 35px;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.2s;
        }

        .close-btn:hover {
            color: var(--accent-color);
        }

        .modal-title {
            margin-top: 0;
            color: var(--primary-color);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .img-container {
            text-align: center;
            width: 100%;
        }

        .img-container img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* --- SEARCH BOX --- */
        .search-container {
            max-width: 600px;
            margin: 0 auto 25px auto;
            position: relative;
        }

        .search-box {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid var(--primary-color);
            border-radius: 25px;
            font-size: 16px;
            outline: none;
            box-sizing: border-box;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* --- TABLE STYLES --- */
        .table-container {
            overflow-x: auto;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            border-radius: 8px;
            background: white;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background-color: var(--primary-color);
            color: white;
        }

        th, td {
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            text-align: left;
        }

        th {
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            white-space: nowrap;
        }

        tbody tr:nth-child(even) { background-color: #f8f9fa; }
        tbody tr:hover { background-color: #f1f1f1; transition: 0.2s; }

        .no-column { width: 60px; text-align: center; font-weight: bold; }
        .alarm-column { width: 220px; color: #2980b9; font-weight: 600; }
        
        .effect-critical { color: #e74c3c; font-weight: bold; }
        .effect-warning { color: #d35400; font-weight: bold; }

        /* --- RESPONSIVE MOBILE --- */
        @media (max-width: 768px) {
            .modal-content { width: 95%; margin: 15% auto; padding: 15px; }
            table, thead, tbody, th, td, tr { display: block; }
            thead tr { position: absolute; top: -9999px; left: -9999px; }
            tr { margin-bottom: 15px; border: 2px solid var(--primary-color); border-radius: 8px; overflow: hidden; }
            td { border: none; border-bottom: 1px solid #eee; position: relative; padding-left: 45% !important; text-align: left !important; white-space: normal; }
            td:before { position: absolute; top: 12px; left: 15px; width: 40%; padding-right: 10px; white-space: nowrap; font-weight: bold; color: var(--primary-color); content: attr(data-label); text-transform: uppercase; font-size: 0.75rem; }
            .no-column { background: #eee; width: auto; }
        }

        /* --- PRINT STYLES --- */
        @media print {
            @page { size: A4 landscape; margin: 1cm; }
            html, body { background: white !important; padding: 0 !important; margin: 0 !important; font-family: Arial, sans-serif !important; font-size: 10pt; }
            .search-container, .search-box, .header-actions, .modal { display: none !important; }
            .table-container { box-shadow: none !important; border-radius: 0 !important; width: 100% !important; }
            table { display: table !important; width: 100% !important; border-collapse: collapse !important; border: 0.5pt solid black !important; }
            thead { display: table-header-group !important; }
            tr { display: table-row !important; page-break-inside: avoid !important; }
            th, td { display: table-cell !important; border: 0.5pt solid black !important; padding: 6pt !important; color: black !important; background: transparent !important; }
            th { background-color: #eeeeee !important; -webkit-print-color-adjust: exact; }
            td:before { display: none !important; }
            td { padding-left: 8px !important; }
            .no-column { width: 30pt !important; text-align: center; }
            .alarm-column { font-weight: bold; width: 120pt !important; }
        }
    </style>
</head>
<body>

    <h2>Danh mục Cảnh báo & Xử lý sự cố TBA/19</h2>

    <!-- THÊM NÚT BẤM XEM ẢNH Ở ĐẦU TRANG -->
    <div class="header-actions">
        <button id="openModalBtn" class="btn-view-map">🔍 Xem sơ đồ vị trí mã lỗi</button>
    </div>

    <!-- KHUNG HỘI THOẠI (MODAL) CHỨA ẢNH -->
    <div id="imageModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="closeModalBtn">&times;</span>
            <h3 class="modal-title">Sơ đồ vị trí mã lỗi hệ thống</h3>
            <div class="img-container">
                <!-- Đường dẫn ảnh trỏ đến /pic.jpg của cậu -->
                <img src="./pic.jpg" alt="Sơ đồ vị trí mã lỗi" onerror="this.onerror=null; this.src='https://placehold.co/800x450?text=Kh%C3%B4ng+t%C3%ACm+th%E1%BA%A5y+file+pic.jpg+trong+th%C6%B0+m%E1%BB%A5c';">
            </div>
        </div>
    </div>

    <div class="search-container">
        <input type="text" id="searchInput" class="search-box" placeholder="Tìm kiếm mã lỗi, tên cảnh báo hoặc nguyên nhân...">
    </div>

    <div class="table-container">
        <table id="alarmTable">
            <thead>
                <tr>
                    <th class="no-column">NO.</th>
                    <th>Alarm</th>
                    <th>Cause</th>
                    <th>Effect</th>
                    <th>Instruction</th>
                </tr>
            </thead>
            <tbody id="alarm-body">
                <!-- Data will be filled here -->
            </tbody>
        </table>
    </div>

    <script>
        // Logic điều khiển đóng mở Modal xem ảnh
        const modal = document.getElementById("imageModal");
        const btn = document.getElementById("openModalBtn");
        const span = document.getElementById("closeModalBtn");

        // Bấm nút thì mở khung ảnh
        btn.onclick = function() {
            modal.style.display = "block";
        }

        // Bấm nút X thì đóng khung
        span.onclick = function() {
            modal.style.display = "none";
        }

        // Bấm ra ngoài vùng ảnh cũng tự đóng khung
        window.onclick = function(event) {
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }

        // Dữ liệu danh mục cảnh báo
        const alarmData = [
            { no: "10", alarm: "Cấp nước làm mát (Cooling water supply)", cause: "Áp suất thấp", effect: "Báo động. Nếu áp suất không đúng > 5 phút, máy chuyển sang Sấy (Drying).", instruction: "Gọi kỹ thuật viên." },
            { no: "11", alarm: "Cấp khí chính (Main air supply)", cause: "Áp suất thấp", effect: "Máy reset về Zero.", instruction: "Gọi kỹ thuật viên." },
            { no: "12", alarm: "Công tắc an toàn (Safety switch)", cause: "a. Cửa hoặc nắp mở<br>b. Tay quay đang cắm<br>c. Cửa ASU/bên/sau mở<br>d. Cửa sau ASU mở", effect: "a. Dừng an toàn (Security stop).<br>b. Reset về Thông khí (Venting).<br>c. Báo động. Vô hiệu hóa ghép mí.<br>d. Dừng ngắn (Short stop).", instruction: "Kiểm tra cửa/nắp hoặc reset tay quay. Xem mục Stop." },
            { no: "13", alarm: "Dừng khẩn cấp (Emergency stop)", cause: "Nút dừng khẩn cấp được nhấn", effect: "Máy reset về Zero.", instruction: "Xem mục Stop." },
            { no: "14", alarm: "Giám sát cửa buồng vô trùng", cause: "Cửa mở", effect: "- Bước Sấy trở lên: Chuyển sang Thông khí<br>- Bước thấp hơn: Đóng cửa tiếp tục", instruction: "Xem mục Stop hoặc đóng cửa." },
            { no: "15", alarm: "Hệ thống hàm kẹp (Jaw system)", cause: "Quá tải", effect: "Máy chuyển sang Sấy (Drying)", instruction: "Gọi kỹ thuật viên." },
            { no: "16", alarm: "Đồng bộ (Synchronisation)", cause: "Bộ gấp cuối chưa đồng bộ", effect: "Dừng ngắn (Short stop)", instruction: "Gọi kỹ thuật viên." },
            { no: "17a", alarm: "HI (nếu có lắp)", cause: "HI đang hoạt động", effect: "Chỉ hiển thị thông báo", instruction: "Không cần hành động nếu đang sản xuất." },
            { no: "17b", alarm: "HL (nếu có lắp)", cause: "HL đang hoạt động", effect: "Chỉ hiển thị thông báo", instruction: "Không cần hành động nếu đang sản xuất." },
            { no: "18", alarm: "Quá tải (Overload)", cause: "Động cơ quá tải", effect: "Dừng an toàn (Security stop)", instruction: "Gọi kỹ thuật viên." },
            { no: "19", alarm: "Chế độ bảo trì (Service state)", cause: "Công tắc chìa khóa bảo trì được kích hoạt", effect: "Chỉ hiển thị thông báo", instruction: "Chỉ được sử dụng bởi nhân viên bảo trì." },
            { no: "20", alarm: "Bôi trơn (Lubrication)", cause: "Áp suất thấp", effect: "Dừng ngắn (Short stop)", instruction: "Nhấn nút Manual lubrication. Nếu lỗi lặp lại, gọi kỹ thuật viên." },
            { no: "21", alarm: "Bôi trơn (Lubrication)", cause: "Mức thấp", effect: "Báo động. Dừng ngắn sau 1 giờ nếu mức vẫn thấp.", instruction: "Châm thêm. Xem mục Weekly care. Nhấn nút Manual lubrication." },
            { no: "22", alarm: "Dầu thủy lực (Hydraulic oil)", cause: "Nhiệt độ cao", effect: "Dừng ngắn (Short stop)", instruction: "Gọi kỹ thuật viên." },
            { no: "23", alarm: "Dầu thủy lực (Hydraulic oil)", cause: "Mức thấp", effect: "Dừng ngắn (Short stop)", instruction: "Châm thêm. Xem mục Weekly care." },
            { no: "24", alarm: "Tốc độ máy (Machine speed)", cause: "Tốc độ quá cao", effect: "Máy chuyển sang chế độ Sấy (Drying)", instruction: "Gọi kỹ thuật viên." },
            { no: "24a", alarm: "Vượt quá thời gian (Gia nhiệt II)", cause: "Preheating II quá lâu (> 7'04\")", effect: "Máy chuyển về Preheating I", instruction: "Nhấn Alarm reset, sau đó nhấn Program up." },
            { no: "24b", alarm: "Vượt quá thời gian (Dừng ngắn)", cause: "Dừng ngắn quá lâu (> 5 phút)", effect: "Máy chuyển sang Sấy (Drying)", instruction: "Reset máy, xem mục Short stop (trang 238)." },
            { no: "25", alarm: "Lỗi PLC (PLC fault)", cause: "Pin yếu, bộ nhớ đầy, quá áp hoặc chương trình bị ghi đè", effect: "Báo động", instruction: "Gọi kỹ thuật viên." },
            { no: "26", alarm: "Lỗi encoder góc (Angle encoder fault)", cause: "Encoder góc bị lỗi", effect: "- Khi Tube sealing: Về Preheating II<br>- Khi Motor start: Sang Sấy (Drying)", instruction: "Gọi kỹ thuật viên." },
            { no: "28", alarm: "Lỗi máy ghi (Recorder fault)", cause: "Hết giấy, cassette ra ngoài, pin yếu", effect: "Dừng ngắn (Short stop)", instruction: "- Hết giấy: Xem mục Loading chart (trang 123/144)<br>- Pin yếu: Gọi kỹ thuật viên" },
            { no: "29a", alarm: "ASU (Inverter fault)", cause: "Lỗi biến tần", effect: "Dừng ngắn (Short stop)", instruction: "Gọi kỹ thuật viên." },
            { no: "29b", alarm: "ASU – Gia nhiệt cảm ứng", cause: "Lỗi bộ HI, cáp hoặc cuộn cảm", effect: "Báo động. Dừng ngắn khi cần ghép mí (splicing).", instruction: "Gọi kỹ thuật viên." },
            { no: "30", alarm: "Bộ tách (Separator)", cause: "Mực nước cao", effect: "Máy reset về vị trí Zero", instruction: "Gọi kỹ thuật viên." },
            { no: "31", alarm: "Bộ gia nhiệt khí (Air superheater)", cause: "Nhiệt độ không đúng", effect: "- Preheating I–III: Không hành động<br>- Bước cao hơn: Sang Thông khí (Venting)", instruction: "Gọi kỹ thuật viên." },
            { no: "32", alarm: "Máy nén khí vô trùng", cause: "Áp suất thấp", effect: "Máy reset về Zero", instruction: "Gọi kỹ thuật viên." },
            { no: "33", alarm: "Van hút (Suction valve)", cause: "Sai vị trí", effect: "Máy chuyển sang Sấy (Drying)", instruction: "Gọi kỹ thuật viên." },
            { no: "34a", alarm: "Hệ thống phun (Spray system)", cause: "Lỗi nạp (Filling up failure)", effect: "Máy reset về Preheating III", instruction: "Reset báo động và nâng bước chương trình (step up)." },
            { no: "34b", alarm: "Hệ thống phun (Spray system)", cause: "Lỗi phun (Spraying failure)", effect: "Máy reset về Thông khí (Venting - 15 phút)", instruction: "Xem mục Mở cửa (trang 163)." },
            { no: "35", alarm: "Dao khí (Air knife)", cause: "Nhiệt độ không đúng", effect: "Dừng ngắn (Short stop)", instruction: "Gọi kỹ thuật viên." },
            { no: "36", alarm: "Van khí nạp (Air inlet valve)", cause: "Sai vị trí", effect: "Máy reset về Thông khí (Venting)", instruction: "Gọi kỹ thuật viên." },
            { no: "37a", alarm: "Vật liệu bao bì (Packaging material)", cause: "Nguồn cấp thấp (Supply low)", effect: "Báo động. Nếu không xử lý sẽ Dừng ngắn.", instruction: "Chuẩn bị ghép cuộn bao bì mới." },
            { no: "37b", alarm: "ASU", cause: "Lỗi ghép mí (Splicing failure)", effect: "Dừng ngắn (Short stop)", instruction: "Thực hiện ghép mí thủ công." },
            { no: "38a", alarm: "Vật liệu bao bì (Packaging material)", cause: "Đứt giấy BÊN TRONG buồng vô trùng", effect: "Máy reset về Sấy (Drying)", instruction: "Cắt bao bì trên hàm kẹp để làm trống ống giấy. Nhấn Program down một lần. Xem trang 240." },
            { no: "38b", alarm: "Vật liệu bao bì (Packaging material)", cause: "Đứt giấy TRƯỚC KHI vào buồng vô trùng", effect: "Máy reset về Sấy (Drying)", instruction: "Dán nối giấy bằng băng keo. Nhấn Program up một lần và chạy nhấp (inch out) phần giấy nối." },
            { no: "38c", alarm: "Vật liệu bao bì (Packaging material)", cause: "Rulo trong cassette ở vị trí cao", effect: "Máy reset về Sấy (Drying)", instruction: "Nới lỏng vật liệu bao bì để reset rulo." },
            { no: "39", alarm: "Phần tử ghép SA (SA splicing element)", cause: "Nhiệt độ thấp", effect: "Dừng ngắn khi cần ghép mí", instruction: "Ở Preheating II: không cần hành động. Ở các bước cao hơn: gọi kỹ thuật viên." },
            { no: "40", alarm: "Bộ IH SA (IH unit SA)", cause: "Lỗi trong bộ IH, cáp hoặc cuộn cảm", effect: "Máy reset về Sấy (Drying)", instruction: "Gọi kỹ thuật viên." },
            { no: "41a", alarm: "SA (Dán dải băng)", cause: "Trong Preheating I: Vị trí dải băng (strip) chưa được xác nhận", effect: "Báo động (Alarm)", instruction: "Mở cửa hộp chứa LS strip, đảm bảo dải băng đặt đúng vị trí trên các lỗ hút chân không." },
            { no: "41b", alarm: "SA (Dán dải băng)", cause: "Trong Sản xuất (Production): Nguồn cấp dải băng thấp", effect: "Báo động. Dừng ngắn (Short stop) khi cần ghép dải băng.", instruction: "Lắp cuộn dải băng LS mới." },
            { no: "42", alarm: "Rulo cán/Dao khí (Calender rollers/air knife)", cause: "Sai vị trí", effect: "Báo động và dừng máy", instruction: "Gọi kỹ thuật viên." },
            { no: "43a", alarm: "Hơi nước (Steam)", cause: "Nhiệt độ không đúng (Từ bước Spraying đến khi bắt đầu Sản xuất)", effect: "Máy reset về vị trí Zero", instruction: "Kiểm tra nguồn cấp từ hệ thống hơi của nhà máy." },
            { no: "43b", alarm: "Hơi nước (Steam)", cause: "Nhiệt độ không đúng (Trong khi Sản xuất)", effect: "Báo động. Nếu nhiệt độ sai > 5 phút, dừng Sản xuất.", instruction: "Kiểm tra nguồn cấp từ hệ thống hơi của nhà máy." },
            { no: "44", alarm: "Vệ sinh màng chắn hơi (Steam barrier cleaning)", cause: "Công tắc chìa khóa đang ở vị trí vệ sinh màng chắn hơi", effect: "Báo động (Alarm)", instruction: "Không cần hành động nếu đang tiến hành vệ sinh khoang màng chắn hơi." },
            { no: "45a", alarm: "Van sản phẩm (Van A)", cause: "Sau khi Sấy (Drying): Nút 'Product set values OK' chưa được nhấn", effect: "Báo động (Alarm)", instruction: "Nhấn nút 'Product set values OK' và tiếp tục." },
            { no: "45b", alarm: "Van sản phẩm (Van A)", cause: "Trong khi Sản xuất: Không có sản phẩm từ bộ tiệt trùng (steriliser)", effect: "Máy reset về Sấy (Drying)", instruction: "Liên hệ quản lý sản xuất để xác nhận khởi động lại." },
            { no: "45c", alarm: "Van sản phẩm (Van A)", cause: "Trong khi Dừng an toàn (Security Stop)", effect: "Báo động (Alarm)", instruction: "Xem mục 'Dừng cung cấp sản phẩm khi dừng an toàn' trang 236." },
            { no: "46", alarm: "Ống dẫn sản phẩm (Product pipe)", cause: "Sai vị trí", effect: "Máy reset về Thông khí (Venting)", instruction: "Kiểm tra vị trí ống dẫn sản phẩm." },
            { no: "47", alarm: "Ống vệ sinh CIP (Cleaning pipe for CIP)", cause: "Sai vị trí", effect: "Chỉ hiển thị báo động", instruction: "Kiểm tra vị trí ống vệ sinh." },
            { no: "48", alarm: "Van khí vô trùng (Van B)", cause: "Sai vị trí", effect: "Máy reset về Thông khí (Venting)", instruction: "Gọi kỹ thuật viên." },
            { no: "49", alarm: "Bể tiệt trùng (Sterilisation bath)", cause: "Sai mức dịch tiệt trùng", effect: "- Trong Sản xuất: Dừng ngắn<br>- Ở các bước thấp hơn: Báo động", instruction: "Gọi kỹ thuật viên." },
            { no: "50", alarm: "Bể tiệt trùng (Sterilisation bath)", cause: "Mức nước thấp", effect: "Dừng ngắn (Short stop)", instruction: "Châm thêm nước đầy." },

            { no: "107", alarm: "Cửa khoang ASU (ASU Door)", cause: "Cửa khoang ASU bị mở trong sản xuất", effect: "Máy dừng an toàn lập tức", instruction: "Đóng cửa khoang ASU và khóa chốt." },
            { no: "108", alarm: "Tốc độ băng tải ra (Outfeed conveyor)", cause: "Băng tải ngoài chạy chậm hơn tốc độ máy", effect: "Kẹt ùn ứ sản phẩm tại lối ra", instruction: "Kiểm tra biến tần điều khiển băng tải ngoài." },
            { no: "109", alarm: "Hệ thống phun sương làm mát", cause: "Nghẹt béc phun làm mát mối hàn", effect: "Mối hàn bị biến dạng nhiệt", instruction: "Tháo béc phun vệ sinh bằng kim chuyên dụng." },
            { no: "110", alarm: "Bộ lưu điện UPS (UPS Fault)", cause: "Ắc quy UPS yếu hoặc lỗi bo mạch", effect: "Cảnh báo, nguy cơ mất dữ liệu khi mất điện", instruction: "Thông báo bảo trì thay thế ắc quy định kỳ." },
            { no: "111", alarm: "Bộ mã hóa xung vòng quay (Pulse encoder)", cause: "Sai lệch số xung phản hồi", effect: "Máy chạy không đều tốc độ", instruction: "Kiểm tra cáp kết nối encoder về bo mạch nhận." },
            { no: "112", alarm: "Áp suất nước CIP", cause: "Áp lực dòng tuần hoàn CIP quá yếu", effect: "Hiệu quả vệ sinh không đạt", instruction: "Kiểm tra bơm tăng áp của hệ thống CIP." },
            { no: "113", alarm: "Nhiệt độ khí xả (Exhaust air temp)", cause: "Khí xả buồng sấy quá nóng", effect: "Hệ thống tự động ngắt đầu đốt/điện trở", instruction: "Kiểm tra lưu lượng quạt hút khí thải." },
            { no: "114", alarm: "Cảm biến bảo vệ quá hành trình", cause: "Cơ cấu cơ khí vượt quá giới hạn biên", effect: "Khóa mọi chuyển động của máy", instruction: "Quay tay máy về vùng an toàn, reset hành trình." },
            { no: "115", alarm: "Nồng độ chất tiệt trùng (H2O2 concentration)", cause: "Nồng độ thấp hơn ngưỡng diệt khuẩn", effect: "Máy không cho phép chuyển sang bước Sản xuất", instruction: "Kiểm tra nồng độ hóa chất đầu vào." },
            { no: "116", alarm: "Hệ thống tổng kiểm tra (Final check)", cause: "Hoàn thành chu trình kiểm tra máy, phát hiện lỗi tổng hợp", effect: "Máy reset hoàn toàn về vị trí ban đầu (Zero position)", instruction: "Liên hệ ngay lập tức với kỹ thuật viên trưởng hoặc đại diện nhà sản xuất." }
        ];

        // Hàm render dữ liệu ra bảng
        function renderTable(data) {
            const tbody = document.getElementById("alarm-body");
            tbody.innerHTML = "";
            
            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; font-weight: bold; padding: 20px;">Không tìm thấy dữ liệu phù hợp!</td></tr>`;
                return;
            }

            data.forEach(item => {
                const tr = document.createElement("tr");
                let effectClass = "";
                if (item.effect.includes("Zero") || item.effect.includes("Dừng an toàn") || item.effect.includes("khẩn cấp")) {
                    effectClass = "effect-critical";
                } else if (item.effect.includes("Sấy") || item.effect.includes("Dừng ngắn") || item.effect.includes("Thông khí")) {
                    effectClass = "effect-warning";
                }

                tr.innerHTML = `
                    <td class="no-column" data-label="NO.">${item.no}</td>
                    <td class="alarm-column" data-label="Alarm">${item.alarm}</td>
                    <td data-label="Cause">${item.cause}</td>
                    <td class="${effectClass}" data-label="Effect">${item.effect}</td>
                    <td data-label="Instruction">${item.instruction}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Logic Tìm kiếm tự động
        function removeSign(str) {
            str = str.toLowerCase();
            str = str.replace(/à|á|ạ|ả|ã|â|ầ|ấ|ậ|ẩ|ẫ|ă|ằ|ắ|ặ|ẳ|ẵ/g, "a");
            str = str.replace(/è|é|ẹ|ẻ|ẽ|ê|ề|ế|ệ|ể|ễ/g, "e");
            str = str.replace(/ì|í|ị|ỉ|ĩ/g, "i");
            str = str.replace(/ò|ó|ọ|ỏ|õ|ô|ồ|ố|ộ|ổ|ỗ|ơ|ờ|ớ|ợ|ở|ỡ/g, "o");
            str = str.replace(/ù|ú|ụ|ủ|ũ|ư|ừ|ứ|ự|ử|ữ/g, "u");
            str = str.replace(/ỳ|ý|ỵ|ỷ|ỹ/g, "y");
            str = str.replace(/đ/g, "d");
            return str;
        }

        document.getElementById("searchInput").addEventListener("input", function(e) {
            const keyword = removeSign(e.target.value.trim());
            const filteredData = alarmData.filter(item => {
                return removeSign(item.no).includes(keyword) || 
                       removeSign(item.alarm).includes(keyword) || 
                       removeSign(item.cause).includes(keyword) ||
                       removeSign(item.effect).includes(keyword) ||
                       removeSign(item.instruction).includes(keyword);
            });
            renderTable(filteredData);
        });

        renderTable(alarmData);
    </script>
</body>
</html>
